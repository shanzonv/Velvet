name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Use a fixed signing key so updates install over the old app
        run: |
          mkdir -p ~/.android
          base64 -d velvet-key.b64 > ~/.android/debug.keystore
      - name: Create Android project and add Velvet code
        run: |
          flutter create --org com.velvet --project-name velvet --platforms android build_app
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib build_app/test
          cp -r lib build_app/lib
      - name: Patch Android files for background audio
        working-directory: build_app
        run: |
          python3 - <<'PY'
          import glob
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m).read()
          perms = ''.join('<uses-permission android:name="android.permission.%s"/>\n' % x for x in ['WAKE_LOCK', 'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_MEDIA_PLAYBACK', 'POST_NOTIFICATIONS', 'INTERNET'])
          s = s.replace('<application', perms + '<application', 1)
          svc = '<service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true"><intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter></service><receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter></receiver>'
          s = s.replace('</application>', svc + '</application>')
          s = s.replace('android:label="velvet"', 'android:label="Velvet"')
          open(m, 'w').write(s)
          for f in glob.glob('android/app/src/main/**/MainActivity.*', recursive=True):
              t = open(f).read()
              t = t.replace('io.flutter.embedding.android.FlutterActivity', 'com.ryanheise.audioservice.AudioServiceActivity').replace('FlutterActivity()', 'AudioServiceActivity()')
              open(f, 'w').write(t)
          import os
          os.makedirs('android/app/src/main/res/drawable', exist_ok=True)
          os.makedirs('android/app/src/main/res/raw', exist_ok=True)
          open('android/app/src/main/res/drawable/ic_notification.xml', 'w').write('<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M12,3v10.55c-0.59,-0.34 -1.27,-0.55 -2,-0.55 -2.21,0 -4,1.79 -4,4s1.79,4 4,4 4,-1.79 4,-4V7h4V3h-6z"/></vector>')
          open('android/app/src/main/res/raw/keep.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?><resources xmlns:tools="http://schemas.android.com/tools" tools:keep="@drawable/ic_notification" />')
          print('CHECK service in manifest:', 'com.ryanheise.audioservice.AudioService' in open(m).read())
          for f in glob.glob('android/app/src/main/**/MainActivity.*', recursive=True):
              print('CHECK activity patched:', f, 'AudioServiceActivity' in open(f).read())
          KTS = 'subprojects {\n    afterEvaluate {\n        extensions.findByName("android")?.withGroovyBuilder { "compileSdkVersion"(36) }\n    }\n}\n\n'
          GROOVY = 'subprojects {\n    afterEvaluate { p ->\n        if (p.hasProperty("android")) { p.android.compileSdkVersion 36 }\n    }\n}\n\n'
          for g, fix in [('android/build.gradle.kts', KTS), ('android/build.gradle', GROOVY)]:
              try:
                  txt = open(g).read()
              except FileNotFoundError:
                  continue
              open(g, 'w').write(fix + txt)
              break
          PY
      - name: Build APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release --build-number=${{ github.run_number }}
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Velvet build ${{ github.run_number }}
          files: build_app/build/app/outputs/flutter-apk/app-release.apk
