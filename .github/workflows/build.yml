name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project and add Velvet code
        run: |
          flutter create --org com.velvet --project-name velvet --platforms android build_app
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib build_app/test
          cp -r lib build_app/lib
      - name: Patch Android files for background audio
        working-directory: build_app
        run: |
          python3 - <<'PY'
          import glob
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m).read()
          perms = ''.join('<uses-permission android:name="android.permission.%s"/>\n' % x for x in ['WAKE_LOCK', 'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_MEDIA_PLAYBACK', 'POST_NOTIFICATIONS'])
          s = s.replace('<application', perms + '<application', 1)
          svc = '<service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true"><intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter></service><receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter></receiver>'
          s = s.replace('</application>', svc + '</application>')
          s = s.replace('android:label="velvet"', 'android:label="Velvet"')
          open(m, 'w').write(s)
          for f in glob.glob('android/app/src/main/**/MainActivity.*', recursive=True):
              t = open(f).read()
              t = t.replace('io.flutter.embedding.android.FlutterActivity', 'com.ryanheise.audioservice.AudioServiceActivity').replace('FlutterActivity()', 'AudioServiceActivity()')
              open(f, 'w').write(t)
          PY
      - name: Build APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Velvet build ${{ github.run_number }}
          files: build_app/build/app/outputs/flutter-apk/app-release.apk
